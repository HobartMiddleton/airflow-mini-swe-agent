---
name: "CodeQL"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - v[0-9]+-[0-9]+-test
      - v[0-9]+-[0-9]+-stable
      - chart/v[0-9]+-[0-9]+x-test
      - chart/v[0-9]+-[0-9]+x-stable
      - airflow-ctl/v[0-9]+-[0-9]+-test
      - airflow-ctl/v[0-9]+-[0-9]+-stable
  push:
    branches:
      - main
      - v[0-9]+-[0-9]+-test
      - v[0-9]+-[0-9]+-stable
      - chart/v[0-9]+-[0-9]+x-test
      - chart/v[0-9]+-[0-9]+x-stable
      - airflow-ctl/v[0-9]+-[0-9]+-test
      - airflow-ctl/v[0-9]+-[0-9]+-stable
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  detect-languages:
    name: Detect languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Detect changed languages
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const compareApiFileLimit = 300;
            const allLanguages = [
              'python',
              'javascript-typescript',
              'actions',
              'go',
              'java-kotlin',
            ];
            const languageMatchers = {
              python: (file) => /\.(py|pyi)$/i.test(file),
              'javascript-typescript': (file) =>
                /\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$/i.test(file),
              actions: (file) =>
                file.startsWith('.github/workflows/') || file.startsWith('.github/actions/'),
              go: (file) =>
                /\.go$/i.test(file) ||
                /(^|\/)(go\.mod|go\.sum|go\.work|go\.work\.sum)$/i.test(file),
              'java-kotlin': (file) =>
                /\.java$/i.test(file) ||
                /\.(kt|kts)$/i.test(file) ||
                /\.gradle(\.kts)?$/i.test(file) ||
                /(^|\/)gradle\.properties$/i.test(file) ||
                /(^|\/)gradlew(\.bat)?$/i.test(file),
            };

            const selectLanguages = (files) => {
              const selected = new Set();
              for (const filename of files) {
                const file = String(filename).toLowerCase();
                for (const [language, matches] of Object.entries(languageMatchers)) {
                  if (matches(file)) {
                    selected.add(language);
                  }
                }
              }
              return allLanguages.filter((language) => selected.has(language));
            };

            const setFullScan = () => {
              core.setOutput('languages', JSON.stringify(allLanguages));
            };

            if (context.eventName === 'schedule') {
              setFullScan();
              return;
            }

            let changedFiles = [];

            if (context.eventName === 'pull_request' || context.eventName === 'pull_request_target') {
              const pullNumber = context.payload.pull_request?.number ?? context.issue.number;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              changedFiles = files.map((file) => file.filename);
            } else if (context.eventName === 'push') {
              const comparisonFiles = [];
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: context.payload.before,
                  head: context.payload.after,
                  per_page: 100,
                });
                if (Array.isArray(comparison.data.files)) {
                  comparisonFiles.push(...comparison.data.files.map((file) => file.filename));
                }
              } catch (error) {
                core.warning(`Unable to compare commits: ${error.message}`);
                if (Array.isArray(error.response?.data?.files)) {
                  comparisonFiles.push(
                    ...error.response.data.files.map((file) => file.filename),
                  );
                }
              }

              if (comparisonFiles.length === 0 || comparisonFiles.length >= compareApiFileLimit) {
                setFullScan();
                return;
              }
              changedFiles = comparisonFiles;
            } else {
              setFullScan();
              return;
            }

            core.setOutput('languages', JSON.stringify(selectLanguages(changedFiles)));

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: detect-languages
    if: >-
      needs.detect-languages.result == 'success' &&
      needs.detect-languages.outputs.languages != '' &&
      needs.detect-languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-languages.outputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build Java SDK
        if: matrix.language == 'java-kotlin'
        working-directory: java-sdk
        run: ./gradlew build

      - name: Autobuild
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
